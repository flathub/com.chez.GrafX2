app-id: com.chez.GrafX2
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: grafx2-sdl2
rename-desktop-file: grafx2.desktop
rename-appdata-file: eu.grafx2.grafx2.metainfo.xml
rename-icon: grafx2
finish-args:
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --filesystem=home # required since GrafX2 doesn't use portals
cleanup:
  # workaround for non-png-icon-in-hicolor-size-folder lint error
  - /share/icons/hicolor/scalable/apps/*.xpm

modules:
  - shared-modules/lua5.3/lua-5.3.5.json
  - shared-modules/SDL2/SDL2_image.json
  - shared-modules/SDL2/SDL2_ttf.json

  - name: grafx2
    no-autogen: true
    subdir: src
    make-args:
      - API=sdl2
    make-install-args:
      - PREFIX=/app
      - API=sdl2
    build-options:
      env:
        C_INCLUDE_PATH: /app/include/SDL2:/app/include:/usr/include/SDL2
        CPLUS_INCLUDE_PATH: /app/include/SDL2:/app/include:/usr/include/SDL2
    post-install:
      # - install -Dm644 /share/
      - desktop-file-edit --set-key Exec --set-value 'grafx2-sdl2 %f' /app/share/applications/grafx2.desktop

    sources:
      # when building from archive, we get the following error:
      # fatal: not a git repository (or any parent up to mount point /run/build)
      - type: git
        url: https://gitlab.com/GrafX2/grafX2
        tag: v2.9
        commit: 7237d93b08d9fdc47a1a86a28b11124671502e90
        x-checker-data:
          type: anitya
          project-id: 14560
          tag-template: v$version
          is-main-source: true

      # Fix appdata paper cuts
      - type: patch
        path: fix-appdata.patch

      # build system depends on this archive being named like GitHub release archives
      # as opposed to https://github.com/redcode/6502/archive/v$version.tar.gz
      - type: file
        url: https://github.com/redcode/6502/releases/download/v0.1/6502-v0.1.tar.xz
        sha256: bba50f327163d40b1014f5affc8042137f37b200dae50a4f0fe56b5769b3940f
        dest: 3rdparty/archives
        x-checker-data:
          type: anitya
          project-id: 153534
          url-template: https://github.com/redcode/6502/releases/download/v$version/6502-v$version.tar.xz

      - type: file
        url: https://libsdl.org/release/SDL2-2.32.10.tar.gz
        sha256: 5f5993c530f084535c65a6879e9b26ad441169b3e25d789d83287040a9ca5165
        dest: 3rdparty/archives
        x-checker-data:
          type: anitya
          project-id: 4779
          url-template: https://libsdl.org/release/SDL2-$version.tar.gz

      # GrafX2 uses the version specified as RECOILVER in 3rdparty/Makefile
      - type: file
        url: https://sourceforge.net/projects/recoil/files/recoil/6.4.2/recoil-6.4.2.tar.gz
        sha256: 23dec191a766b55d6057a8886285cee9defcccecb141ae777f4245a6dc63e3dc
        dest: 3rdparty/archives

      # Don't download dependencies at build time
      - type: shell
        commands:
          - sed -i 's|wget|true|g' 3rdparty/Makefile
          - sed -i 's|curl|true|g' 3rdparty/Makefile
